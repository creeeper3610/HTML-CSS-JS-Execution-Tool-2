<body>

<header>
    <div class="flex items-center gap-4">
        <h1 class="font-bold text-white text-lg">HTML/CSS/JS 実行ツール2</h1>

            <button class="btn btn-secondary" onclick="triggerUpload('zip')">ZIP</button>
            <button class="btn btn-secondary" onclick="triggerUpload('folder')">フォルダ</button>

</header>

<div id="container">

    <div id="sidebar">

            <!-- Files injected here -->

            <!-- Tabs injected here -->
        </div>
        <div id="monaco-container"></div>
    </div>
</div>

<!-- Hidden Inputs -->
<input type="file" id="input-file" multiple onchange="handleFileSelect(event)">
<input type="file" id="input-zip" accept=".zip" onchange="handleZipSelect(event)">
<input type="file" id="input-folder" webkitdirectory mozdirectory onchange="handleFileSelect(event)">

        <p class="mb-6 text-gray-400">すでにコードが入力されています。アップロードした内容で上書きしてもよろしいですか？</p>
        <div class="flex justify-center gap-4">
            <button class="btn btn-secondary px-8" onclick="closeModal(false)">いいえ</button>
            <button class="btn btn-primary px-8" onclick="closeModal(true)">はい</button>

<script>
    // --- State Management ---
    let files = {
        'index.html': { name: 'index.html', type: 'html', content: '<h1>Hello World</h1>', language: 'html' },
        'style.css': { name: 'style.css', type: 'css', content: 'body { background: #f0f0f0; }', language: 'css' },
        'script.js': { name: 'script.js', type: 'js', content: 'console.log("Started!");', language: 'javascript' }
    };
    let activeFileId = 'index.html';
    let editor = null;
    let assets = {}; // Store binary data like images (Blob URLs)
    let resolveOverwrite = null;

    // --- Monaco Initialization ---
    require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' }});
    require(['vs/editor/editor.main'], function() {
        editor = monaco.editor.create(document.getElementById('monaco-container'), {
            value: files[activeFileId].content,
            language: files[activeFileId].language,
            theme: 'vs-dark',
            automaticLayout: true,
            fontSize: 14,
            minimap: { enabled: false }
        });

        editor.onDidChangeModelContent(() => {
            if (activeFileId && files[activeFileId]) {
                files[activeFileId].content = editor.getValue();
            }
        });

        renderSidebar();
        renderTabs();
        lucide.createIcons();
    });

    // --- File System Logic ---
    function renderSidebar() {
        const list = document.getElementById('file-list');
        list.innerHTML = '';
        Object.keys(files).forEach(id => {
            const item = document.createElement('div');
            item.className = `file-item ${activeFileId === id ? 'active' : ''}`;
            const icon = id.endsWith('.html') ? 'layout' : id.endsWith('.css') ? 'palette' : 'code';
            item.innerHTML = `<i data-lucide="${icon}" class="w-4 h-4 mr-2"></i> ${id}`;
            item.onclick = () => switchFile(id);
            list.appendChild(item);
        });
        
        // Render assets (images etc)
        if (Object.keys(assets).length > 0) {
            const assetHeader = document.createElement('div');
            assetHeader.className = "folder-header mt-4";
            assetHeader.innerText = "アセット";
            list.appendChild(assetHeader);
            Object.keys(assets).forEach(id => {
                const item = document.createElement('div');
                item.className = "file-item text-gray-500 opacity-70";
                item.innerHTML = `<i data-lucide="image" class="w-4 h-4 mr-2"></i> ${id}`;
                list.appendChild(item);
            });
        }
        lucide.createIcons();
    }

    function renderTabs() {
        const tabBar = document.getElementById('tab-bar');
        tabBar.innerHTML = '';
        Object.keys(files).forEach(id => {
            const tab = document.createElement('div');
            tab.className = `tab ${activeFileId === id ? 'active' : ''}`;
            tab.innerHTML = `<span>${id}</span>`;
            tab.onclick = () => switchFile(id);
            tabBar.appendChild(tab);
        });
    }

    function switchFile(id) {
        if (!files[id]) return;
        activeFileId = id;
        const model = monaco.editor.createModel(files[id].content, files[id].language);
        editor.setModel(model);
        renderSidebar();
        renderTabs();
    }

    function addNewFile(type) {
        const id = `extra-${Object.keys(files).length}.${type}`;
        files[id] = {
            name: id,
            type: type,
            content: `/* New ${type} file */`,
            language: type === 'css' ? 'css' : 'javascript'
        };
        switchFile(id);
    }

    // --- Upload Handlers ---
    function triggerUpload(mode) {
        document.getElementById(`input-${mode}`).click();
    }

    async function checkOverwrite() {
        const isDefault = (
            files['index.html']?.content.includes('<h1>Hello World</h1>') &&
            files['style.css']?.content.includes('background: #f0f0f0') &&
            Object.keys(files).length <= 3
        );
        const isEmpty = Object.values(files).every(f => f.content.trim() === '');
        
        if (isDefault || isEmpty) return true;

        document.getElementById('modal-overlay').style.display = 'grid';
        return new Promise(resolve => {
            resolveOverwrite = resolve;
        });
    }

    function closeModal(result) {
        document.getElementById('modal-overlay').style.display = 'none';
        if (resolveOverwrite) resolveOverwrite(result);
    }

    async function handleFileSelect(event) {
        const uploadedFiles = Array.from(event.target.files);
        if (uploadedFiles.length === 0) return;

        const shouldProceed = await checkOverwrite();
        if (!shouldProceed) return;

        processFiles(uploadedFiles);
    }

    async function handleZipSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        const shouldProceed = await checkOverwrite();
        if (!shouldProceed) return;

        const zip = await JSZip.loadAsync(file);
        const filePromises = [];
        
        zip.forEach((relativePath, zipEntry) => {
            if (!zipEntry.dir) {
                filePromises.push((async () => {
                    const blob = await zipEntry.async("blob");
                    // Create a File-like object
                    return new File([blob], relativePath, { type: getMimeType(relativePath) });
                })());
            }
        });

        const extractedFiles = await Promise.all(filePromises);
        processFiles(extractedFiles);
    }

    function getMimeType(filename) {
        if (filename.endsWith('.html')) return 'text/html';
        if (filename.endsWith('.css')) return 'text/css';
        if (filename.endsWith('.js')) return 'text/javascript';
        if (filename.endsWith('.png')) return 'image/png';
        if (filename.endsWith('.jpg') || filename.endsWith('.jpeg')) return 'image/jpeg';
        if (filename.endsWith('.svg')) return 'image/svg+xml';
        return 'application/octet-stream';
    }

    async function processFiles(fileList) {
        // Reset only core files if we are doing a "replacement" upload
        let newFiles = {};
        let newAssets = {};

        for (const file of fileList) {
            const name = file.name.split('/').pop(); // フォルダ構造があってもファイル名を取得
            const ext = name.split('.').pop().toLowerCase();

            if (['html', 'css', 'js'].includes(ext)) {
                const text = await file.text();
                newFiles[name] = {
                    name: name,
                    type: ext,
                    content: text,
                    language: ext === 'js' ? 'javascript' : ext
                };
            } else {
                // Image or other asset
                const url = URL.createObjectURL(file);
                newAssets[name] = url;
            }
        }

        if (Object.keys(newFiles).length > 0) {
            files = newFiles;
            activeFileId = Object.keys(files)[0];
            editor.setValue(files[activeFileId].content);
            monaco.editor.setModelLanguage(editor.getModel(), files[activeFileId].language);
        }
        
        // Append assets instead of replacing (keep references)
        assets = { ...assets, ...newAssets };
        
        renderSidebar();
        renderTabs();
    }

    // --- Execution Logic ---
    function executeApp() {
        const htmlFile = Object.values(files).find(f => f.type === 'html') || { content: '' };
        let finalHtml = htmlFile.content;

        // CSS Injection
        let styles = "";
        Object.values(files).filter(f => f.type === 'css').forEach(f => {
            styles += `\n/* ${f.name} */\n${f.content}`;
        });

        // JS Injection
        let scripts = "";
        Object.values(files).filter(f => f.type === 'js').forEach(f => {
            scripts += `\n// ${f.name}\n${f.content}`;
        });

        // Replace asset references in HTML and CSS
        // This is a simple replacement for local filenames to Blob URLs
        Object.entries(assets).forEach(([name, url]) => {
            const regex = new RegExp(name, 'g');
            finalHtml = finalHtml.replace(regex, url);
            styles = styles.replace(regex, url);
        });

        const combined = `
            <!DOCTYPE html>
            <html>
            <head>
                <meta charset="UTF-8">
                <style>${styles}</style>
            </head>
            <body>
                ${finalHtml}
                <script>${scripts}<\/script>
            </body>
            </html>
        `;

        const win = window.open('about:blank', '_blank');
        if (win) {
            win.document.open();
            win.document.write(combined);
            win.document.close();
        } else {
            alert('ポップアップを許可してください！');
        }
    }
</script>

</body>
</html>
